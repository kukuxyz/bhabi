<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Full Width</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <img src="page.jpg" alt="Responsive Image" />
</body>
</html>
