<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Realtime DB Viewer (Full JSON)</title>
  <style>
    body {
      font-family: monospace;
      background: #f0f0f0;
      padding: 20px;
    }
    pre {
      background: #fff;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      max-height: 90vh;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>🔥 Full Firebase Realtime Database Viewer</h2>
  <pre id="jsonDisplay">Connecting to Firebase...</pre>

  <script>
    // ✅ Replace this with your actual Firebase config
const firebaseConfig = {
      apiKey: "AIzaSyDxlxSBiCEFf0PtWKoCSsA6BcpibN85x-Y",
      authDomain: "dmart-website-6c48c.firebaseapp.com",
      databaseURL: "https://dmart-website-6c48c-default-rtdb.firebaseio.com",
      projectId: "dmart-website-6c48c",
      storageBucket: "dmart-website-6c48c.appspot.com",
      messagingSenderId: "960037120520",
      appId: "1:960037120520:web:952c932d345bca51d03fbd",
      measurementId: "G-51BMQD6D13"
    };

    // ✅ Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const jsonDisplay = document.getElementById("jsonDisplay");

    // ✅ Listen to the entire DB root
    db.ref("/").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        jsonDisplay.textContent = JSON.stringify(data, null, 2);
      } else {
        jsonDisplay.textContent = "Database is empty.";
      }
    }, (error) => {
      jsonDisplay.textContent = "Error: " + error.message;
    });
  </script>

</body>
</html>
