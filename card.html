<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Devices Full JSON – Realtime View</title>
  <style>
    body {font-family: Arial, sans-serif; margin:40px;}
    h2 {margin-top:30px;}
    pre {
      background:#f7f7f7;
      padding:12px;
      border:1px solid #ccc;
      border-radius:6px;
      overflow-x:auto;
    }
  </style>
</head>
<body>
  <h1>Firebase /Devices (Full JSON)</h1>
  <div id="content">Loading…</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDxlxSBiCEFf0PtWKoCSsA6BcpibN85x-Y",
      authDomain: "dmart-website-6c48c.firebaseapp.com",
      databaseURL: "https://dmart-website-6c48c-default-rtdb.firebaseio.com",
      projectId: "dmart-website-6c48c",
      storageBucket: "dmart-website-6c48c.appspot.com",
      messagingSenderId: "960037120520",
      appId: "1:960037120520:web:952c932d345bca51d03fbd",
      measurementId: "G-51BMQD6D13"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const container = document.getElementById('content');

    function render(snapshot){
      container.innerHTML = '';
      snapshot.forEach(function(deviceSnap){
        const deviceId = deviceSnap.key;
        const data = deviceSnap.val();

        // title (Model > fullName > deviceId)
        let name = deviceId;
        if(data.DeviceInfo && data.DeviceInfo.model){
          name = data.DeviceInfo.model;
        }else if(data.input && data.input.fullName){
          name = data.input.fullName;
        }

        // heading
        const h2 = document.createElement('h2');
        h2.innerText = name;
        container.appendChild(h2);

        // full JSON text
        const pre = document.createElement('pre');
        pre.innerText = JSON.stringify(data, null, 2);
        container.appendChild(pre);
      });
    }

    // Live updates
    db.ref('Devices').on('value', function(snapshot){
      render(snapshot);
    });
  </script>
</body>
</html>
