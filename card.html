<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Realtime JSON View</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #00FF00;
      padding: 20px;
    }
    pre {
      background: #222;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 90vh;
    }
  </style>
</head>
<body>

<h2>Live Firebase JSON Data</h2>
<pre id="output">{}</pre>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

  // Your Firebase config (Company ki taraf se values)
  const firebaseConfig = {
    apiKey: "AIzaSyDRhaZ13pSKBFg9JH2ATbekTVizRk0uAcE",
    authDomain: "companykitarfse.firebaseapp.com",
    projectId: "companykitarfse",
    storageBucket: "companykitarfse.firebasestorage.app",
    messagingSenderId: "217162599533",
    appId: "1:217162599533:android:522a95555f758f62748364"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Live listener
  const output = document.getElementById("output");
  const packagesRef = ref(db, "packages");

  onValue(packagesRef, (snapshot) => {
    const data = snapshot.val();
    output.innerText = JSON.stringify(data, null, 2); // pretty print
  });
</script>

</body>
</html>
