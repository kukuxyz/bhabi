<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Realtime Viewer</title>
  <style>
    body {
      font-family: monospace;
      background: #f0f0f0;
      padding: 20px;
    }
    pre {
      background: white;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>🔥 Realtime Firebase JSON Viewer</h2>
  <pre id="jsonDisplay">Loading...</pre>

  <script>
    // TODO: Replace with your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyA_z1ekX-HjLfobKjOAKzNgmZHL5xOEBJw",                     // <string name="google_api_key">
  authDomain: "m23dm1a2.firebaseapp.com",                                // based on <string name="project_id">
  databaseURL: "https://m23dm1a2-default-rtdb.europe-west1.firebasedatabase.app", // <string name="firebase_database_url">
  projectId: "m23dm1a2",                                                 // <string name="project_id">
  storageBucket: "m23dm1a2.firebasestorage.app",                         // <string name="google_storage_bucket">
  messagingSenderId: "402219275845",                                     // <string name="gcm_defaultSenderId">
  appId: "1:402219275845:android:63a0b32cf7a20c28a9b52c"                 // <string name="google_app_id">
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const jsonDisplay = document.getElementById("jsonDisplay");

    // Listen to the entire root (or change path)
    db.ref("/packages").on("value", (snapshot) => {
      const data = snapshot.val();
      jsonDisplay.textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
