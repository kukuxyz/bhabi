<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Database Viewer</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        .database-tree {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .tree-node {
            margin-left: 20px;
            position: relative;
        }
        .tree-key {
            font-weight: bold;
            color: #8e44ad;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .tree-key:hover {
            background-color: #f0f0f0;
        }
        .tree-key::before {
            content: '▼ ';
            color: #7f8c8d;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .tree-key.collapsed::before {
            content: '▶ ';
            transform: rotate(0deg);
        }
        .tree-value {
            color: #27ae60;
            margin-left: 10px;
        }
        .tree-value.string {
            color: #e67e22;
        }
        .tree-value.number {
            color: #3498db;
        }
        .tree-value.boolean {
            color: #9b59b6;
        }
        .tree-value.null {
            color: #95a5a6;
            font-style: italic;
        }
        .tree-children {
            margin-top: 5px;
            border-left: 2px solid #ecf0f1;
            padding-left: 15px;
            transition: all 0.3s ease;
        }
        .tree-children.collapsed {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 18px;
        }
        .error {
            color: #e74c3c;
            background-color: #fdf2f2;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin: 20px 0;
        }
        .stats {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #3498db;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 10px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn.secondary {
            background-color: #95a5a6;
        }
        .btn.secondary:hover {
            background-color: #7f8c8d;
        }
        .search-box {
            padding: 10px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 14px;
            width: 300px;
            margin: 0 10px;
        }
        .search-box:focus {
            outline: none;
            border-color: #3498db;
        }
        .highlight {
            background-color: #fff3cd;
            padding: 1px 3px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Firebase Database Viewer</h1>
        
        <div class="controls">
            <input type="text" id="search-box" class="search-box" placeholder="Search in database...">
            <button class="btn" onclick="refreshData()">Refresh</button>
            <button class="btn secondary" onclick="expandAll()">Expand All</button>
            <button class="btn secondary" onclick="collapseAll()">Collapse All</button>
        </div>

        <div id="stats-container"></div>
        <div id="database-container">
            <div class="loading">Loading database from Firebase...</div>
        </div>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA_z1ekX-HjLfobKjOAKzNgmZHL5xOEBJw",
            authDomain: "m23dm1a2.firebaseapp.com",
            projectId: "m23dm1a2",
            storageBucket: "m23dm1a2.firebasestorage.app",
            messagingSenderId: "402219275845",
            appId: "1:402219275845:android:786ab56859cbe9b3a9b52c",
            databaseURL: "https://m23dm1a2-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const rootRef = database.ref();

        let fullData = null;
        let searchTerm = '';

        // Function to count database statistics
        function calculateStats(data) {
            let totalNodes = 0;
            let totalValues = 0;
            let dataTypes = { string: 0, number: 0, boolean: 0, null: 0, object: 0, array: 0 };

            function traverse(obj) {
                if (obj === null) {
                    totalValues++;
                    dataTypes.null++;
                    return;
                }
                
                if (Array.isArray(obj)) {
                    totalNodes++;
                    dataTypes.array++;
                    obj.forEach(traverse);
                } else if (typeof obj === 'object') {
                    totalNodes++;
                    dataTypes.object++;
                    Object.values(obj).forEach(traverse);
                } else {
                    totalValues++;
                    dataTypes[typeof obj]++;
                }
            }

            traverse(data);
            return { totalNodes, totalValues, dataTypes };
        }

        // Function to display database statistics
        function displayStats(data) {
            const stats = calculateStats(data);
            const statsContainer = document.getElementById('stats-container');
            
            statsContainer.innerHTML = `
                <div class="stats">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number">${stats.totalNodes}</div>
                            <div class="stat-label">Total Objects/Arrays</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${stats.totalValues}</div>
                            <div class="stat-label">Total Values</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${stats.dataTypes.string}</div>
                            <div class="stat-label">Strings</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${stats.dataTypes.number}</div>
                            <div class="stat-label">Numbers</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${stats.dataTypes.boolean}</div>
                            <div class="stat-label">Booleans</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number">${Object.keys(data || {}).length}</div>
                            <div class="stat-label">Root Keys</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Function to highlight search terms
        function highlightText(text, search) {
            if (!search) return text;
            const regex = new RegExp(`(${search})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Function to check if a node matches search criteria
        function matchesSearch(key, value, search) {
            if (!search) return true;
            
            const searchLower = search.toLowerCase();
            const keyMatch = key.toLowerCase().includes(searchLower);
            
            if (keyMatch) return true;
            
            if (typeof value === 'string') {
                return value.toLowerCase().includes(searchLower);
            }
            
            return false;
        }

        // Function to render a tree node
        function renderTreeNode(key, value, path = '') {
            const currentPath = path ? `${path}.${key}` : key;
            const nodeId = `node-${currentPath.replace(/\./g, '-')}`;
            
            if (value === null) {
                const matches = matchesSearch(key, value, searchTerm);
                if (!matches && searchTerm) return '';
                
                return `
                    <div class="tree-node">
                        <span class="tree-key" style="cursor: default;">${highlightText(key, searchTerm)}</span>
                        <span class="tree-value null">null</span>
                    </div>
                `;
            }
            
            if (typeof value !== 'object' || Array.isArray(value)) {
                const matches = matchesSearch(key, value, searchTerm);
                if (!matches && searchTerm) return '';
                
                let valueClass = typeof value;
                if (Array.isArray(value)) valueClass = 'array';
                
                let displayValue = value;
                if (typeof value === 'string') {
                    displayValue = `"${value}"`;
                } else if (Array.isArray(value)) {
                    displayValue = `Array(${value.length})`;
                }
                
                return `
                    <div class="tree-node">
                        <span class="tree-key" style="cursor: default;">${highlightText(key, searchTerm)}</span>
                        <span class="tree-value ${valueClass}">${highlightText(String(displayValue), searchTerm)}</span>
                    </div>
                `;
            }
            
            // Object case
            const childrenHtml = Object.entries(value)
                .map(([childKey, childValue]) => renderTreeNode(childKey, childValue, currentPath))
                .filter(html => html) // Remove empty results from search filtering
                .join('');
            
            if (!childrenHtml && searchTerm) return '';
            
            const hasMatch = matchesSearch(key, '', searchTerm) || childrenHtml.includes('highlight');
            if (!hasMatch && searchTerm) return '';
            
            return `
                <div class="tree-node">
                    <span class="tree-key" onclick="toggleNode('${nodeId}')">${highlightText(key, searchTerm)}</span>
                    <span class="tree-value">Object(${Object.keys(value).length})</span>
                    <div class="tree-children" id="${nodeId}">
                        ${childrenHtml}
                    </div>
                </div>
            `;
        }

        // Function to toggle node expansion
        function toggleNode(nodeId) {
            const node = document.getElementById(nodeId);
            const keyElement = document.querySelector(`[onclick="toggleNode('${nodeId}')"]`);
            
            if (node.classList.contains('collapsed')) {
                node.classList.remove('collapsed');
                keyElement.classList.remove('collapsed');
            } else {
                node.classList.add('collapsed');
                keyElement.classList.add('collapsed');
            }
        }

        // Function to display the full database
        function displayDatabase(data) {
            const container = document.getElementById('database-container');
            
            if (!data) {
                container.innerHTML = '<div class="error">No data found in the database.</div>';
                return;
            }
            
            const treeHtml = Object.entries(data)
                .map(([key, value]) => renderTreeNode(key, value))
                .filter(html => html)
                .join('');
            
            if (!treeHtml && searchTerm) {
                container.innerHTML = '<div class="error">No results found for your search.</div>';
                return;
            }
            
            container.innerHTML = `<div class="database-tree">${treeHtml}</div>`;
        }

        // Function to fetch and display data
        function fetchAndDisplayData() {
            document.getElementById('database-container').innerHTML = '<div class="loading">Loading database from Firebase...</div>';
            document.getElementById('stats-container').innerHTML = '';
            
            rootRef.once('value')
                .then((snapshot) => {
                    fullData = snapshot.val();
                    displayStats(fullData);
                    displayDatabase(fullData);
                })
                .catch((error) => {
                    console.error("Error fetching data:", error);
                    document.getElementById('database-container').innerHTML = 
                        '<div class="error">Error loading data from Firebase. Please check console for details.</div>';
                });
        }

        // Function to refresh data
        function refreshData() {
            fetchAndDisplayData();
        }

        // Function to expand all nodes
        function expandAll() {
            document.querySelectorAll('.tree-children.collapsed').forEach(node => {
                node.classList.remove('collapsed');
            });
            document.querySelectorAll('.tree-key.collapsed').forEach(key => {
                key.classList.remove('collapsed');
            });
        }

        // Function to collapse all nodes
        function collapseAll() {
            document.querySelectorAll('.tree-children').forEach(node => {
                node.classList.add('collapsed');
            });
            document.querySelectorAll('.tree-key').forEach(key => {
                if (key.onclick) {
                    key.classList.add('collapsed');
                }
            });
        }

        // Search functionality
        document.getElementById('search-box').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            if (fullData) {
                displayDatabase(fullData);
            }
        });

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', fetchAndDisplayData);

        // Make functions globally available
        window.toggleNode = toggleNode;
        window.refreshData = refreshData;
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
    </script>
</body>
</html>
