<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Realtime Database Viewer</title>
</head>
<body>
  <h1>Realtime Database Contents</h1>
  <textarea id="output" style="width:100%;height:300px;"></textarea>
  <button onclick="pushWholeDb()">Save Edited JSON</button>

  <h2>Edit Value</h2>
  <input type="text" id="dbPath" placeholder="Path (e.g., Devices/device1/status)" />
  <input type="text" id="dbValue" placeholder="New Value" />
  <button onclick="updateValue()">Update Firebase</button>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // Firebase configuration from your XML resources
    const firebaseConfig = {
      apiKey: "AIzaSyA1henjPKk-Gb2OxuVyUZ1B_ghcaJKuHdI",
      authDomain: "could-a6658.firebaseapp.com",
      databaseURL: "https://could-a6658-default-rtdb.firebaseio.com",
      projectId: "could-a6658",
      storageBucket: "could-a6658.firebasestorage.app",
      messagingSenderId: "976655953666",
      appId: "1:976655953666:android:274057a84566f121439c1b"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Reference to the database service
    const database = firebase.database();

    // Function to fetch entire database
    function fetchDatabase() {
      database.ref().on('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      });
    }

    function updateValue(){
      const path = document.getElementById('dbPath').value;
      const val = document.getElementById('dbValue').value;
      database.ref(path).set(val);
    }
    
    function pushWholeDb(){
      try {
        const json = JSON.parse(document.getElementById('output').value);
        database.ref().set(json);
      } catch(e) {
        alert('Invalid JSON');
      }
    }
    
    // Call the function on load
    fetchDatabase();
  </script>
</body>
</html>
