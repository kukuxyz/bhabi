<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Firebase JSON (Realtime)</title>
  <style>
    body {font-family: monospace; margin: 40px; background: #f4f4f4;}
    pre {background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word;}
  </style>
</head>
<body>
  <h1>Full Firebase Database JSON (Realtime)</h1>
  <pre id="content">Loading...</pre>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsXFp45tGYHCEZ-z4uYR8o1MYb3EhLTZg",
      authDomain: "dmart-upipin-1457-8-8-25.firebaseapp.com",
      projectId: "dmart-upipin-1457-8-8-25",
      storageBucket: "dmart-upipin-1457-8-8-25.firebasestorage.app",
      messagingSenderId: "391446281272",
      appId: "1:391446281272:android:19f745ba7d7dcd4b7e3acd",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const container = document.getElementById('content');

    // Listen to the root of the database
    db.ref('/').on('value', function(snapshot){
      const data = snapshot.val();
      container.textContent = JSON.stringify(data, null, 2); // Pretty-printed JSON
    });
  </script>
</body>
</html>
