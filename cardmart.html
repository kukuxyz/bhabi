<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 Firebase Firestore Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .json-container { background: #1e1e1e; color: #f8f8f2; padding: 20px; border-radius: 8px; }
    .json-display { white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Firestore Database Viewer</h1>
  <input type="text" id="collectionPath" placeholder="Enter collection (e.g., users)" />
  <button onclick="loadCollection()">Load Collection</button>
  
  <div class="json-container">
    <div id="jsonDisplay" class="json-display">No data loaded yet.</div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Firebase config (no Realtime DB)
    // Your Firebase config (no Realtime DB)
const firebaseConfig = { apiKey: "AIzaSyDRhaZ13pSKBFg9JH2ATbekTVizRk0uAcE",
                        authDomain: "companykitarfse.firebaseapp.com", 
                        databaseURL: "https://companykitarfse-default-rtdb.firebaseio.com", 
                        projectId: "companykitarfse", 
                        storageBucket: "companykitarfse.firebasestorage.app", 
                        messagingSenderId: "217162599533", 
                        appId: "1:217162599533:android:77951081e92d98b7748364" 
                       };


    // Init Firebase + Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadCollection() {
      const path = document.getElementById("collectionPath").value.trim();
      if (!path) {
        alert("Please enter a collection name (e.g., users, products)");
        return;
      }

      try {
        const querySnapshot = await getDocs(collection(db, path));
        let result = {};
        querySnapshot.forEach((doc) => {
          result[doc.id] = doc.data();
        });

        document.getElementById("jsonDisplay").textContent =
          JSON.stringify(result, null, 2) || `No documents found in ${path}`;
      } catch (error) {
        document.getElementById("jsonDisplay").textContent = `Error: ${error.message}`;
        console.error("Firestore error:", error);
      }
    }

    // Expose function globally
    window.loadCollection = loadCollection;
  </script>
</body>
</html>
